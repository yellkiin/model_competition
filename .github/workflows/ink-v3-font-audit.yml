name: Ink v3 paper font audit
on:
  push:
    branches: [figures/engraved-workflow-v3-20260926]
    paths: [.github/workflows/ink-v3-font-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check installed paper font families and vector renderer
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $families = (New-Object System.Drawing.Text.InstalledFontCollection).Families.Name
          foreach ($name in @('SimSun', 'NSimSun', 'Times New Roman', 'SimHei')) {
            Write-Output "$name : $($families -contains $name)"
          }
          Get-ChildItem C:\Windows\Fonts | Where-Object { $_.Name -match 'simsun|times|simhei' } | Select-Object Name,Length
          Get-Command inkscape -ErrorAction SilentlyContinue | Select-Object Source
          Write-Output "Inkscape known path: $(Test-Path 'C:\Program Files\Inkscape\bin\inkscape.exe')"
          exit 0
