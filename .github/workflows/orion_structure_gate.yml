name: ORION structure real-data gate
on:
  pull_request:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research_a_orion_anytime
            research_a_orion_track_structure
            题目/A题
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cold paired old/new 30-second gate
        shell: bash
        run: |
          set -euo pipefail
          python -m research_a_orion_track_structure.run             --cases 016,024,044,048,059             --questions 1,2,3 --cores 2,5             --seconds 30 --wall-seconds 1250             --max-evaluations 8 --workers 2             --out gate_outputs/cold30
          echo PER_CASE_BEGIN
          cat gate_outputs/cold30/per_case.csv
          echo PER_CASE_END
          echo TRAJECTORY_BEGIN
          cat gate_outputs/cold30/trajectory.csv
          echo TRAJECTORY_END
          cat gate_outputs/cold30/run_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: orion-structure-cold30
          path: gate_outputs/cold30/
