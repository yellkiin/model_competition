name: ORION structure real-data gate
on:
  pull_request:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research_a_orion_anytime
            research_a_orion_track_structure
            tools/a_input_payloads
            tools/restore_a_inputs.py
            题目/A题/通用神经网络处理器下的多核调度问题  附件/code
      - name: Restore selected official inputs
        shell: bash
        run: |
          set -euo pipefail
          OFF='题目/A题/通用神经网络处理器下的多核调度问题  附件'
          python tools/restore_a_inputs.py --payload-dir tools/a_input_payloads --output-dir "$OFF/data" --cases 16 24 44 48 59 64 84 --replace-lfs-pointers
      - name: Extract verified day01 044 q2 n3 seed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          root=Path('research_a_orion_anytime/team_results/day01')
          out=Path('/tmp/seed_044_q2_n3.json')
          found=False
          for shard, manifest_name in [('shard_0','TRANSFER_PARTS.json'),('shard_1','ARCHIVE_PARTS.json')]:
              d=root/shard/'final'
              m=json.loads((d/manifest_name).read_text(encoding='utf-8-sig'))
              zpath=Path('/tmp')/m['archive_name']
              with zpath.open('wb') as w:
                  for p in m['parts']:
                      w.write((d/p['name']).read_bytes())
              with zipfile.ZipFile(zpath) as z:
                  for name in z.namelist():
                      if name.endswith('case_044_q2_n3/progress.json'):
                          prog=json.loads(z.read(name))
                          meta=prog.get('incumbent')
                          if not meta:
                              continue
                          parent=name.rsplit('/',1)[0]
                          pf=meta['plan_file'].replace('\\','/')
                          if pf.startswith('incumbents/'):
                              plan_name=parent+'/'+pf
                          elif '/incumbents/' in pf:
                              plan_name=parent+'/incumbents/'+pf.split('/incumbents/',1)[1]
                          else:
                              raise RuntimeError('unexpected plan_file '+pf)
                          plan=json.loads(z.read(plan_name))
                          out.write_text(json.dumps(plan,separators=(',',':')),encoding='utf8')
                          Path('/tmp/seed_index.json').write_text(json.dumps([{
                              'case':'case_044','q':2,'target_n':5,
                              'plan_file':str(out),'source':'day01 q2 n3 incumbent; seed cost from archive not reassigned'
                          }]),encoding='utf8')
                          print('SEED_SOURCE',shard,name,'makespan',meta.get('makespan'),'plan',plan_name)
                          found=True
                          break
                  if found:
                      break
          if not found:
              raise SystemExit('day01 case_044_q2_n3 incumbent not found')
          PY
      - name: Re-evaluate padded 044 q2 n3 plan at five cores
        shell: bash
        run: |
          set -euo pipefail
          OFF='题目/A题/通用神经网络处理器下的多核调度问题  附件'
          python -u -m research_a_orion_track_structure.run             --cases 044 --questions 2 --cores 5 --seconds 60 --wall-seconds 180             --max-evaluations 6 --workers 1 --official "$OFF"             --out /tmp/structure_044_pad --seed-index /tmp/seed_index.json --skip-paired
          echo '=== PADDED 044 per_case ==='
          cat /tmp/structure_044_pad/per_case.csv
          echo '=== PADDED 044 trajectory ==='
          cat /tmp/structure_044_pad/trajectory.csv
      - name: Same-machine small cold comparison on real graphs
        shell: bash
        run: |
          set -euo pipefail
          OFF='题目/A题/通用神经网络处理器下的多核调度问题  附件'
          python -u -m research_a_orion_track_structure.run             --cases 016,024,044,048,059,064,084 --questions 1,2,3 --cores 2,5             --seconds 20 --wall-seconds 900 --max-evaluations 4 --workers auto             --official "$OFF" --out /tmp/structure_mini
          echo '=== MINI per_case ==='
          cat /tmp/structure_mini/per_case.csv
          echo '=== MINI trajectory ==='
          cat /tmp/structure_mini/trajectory.csv
          echo '=== MINI summary ==='
          cat /tmp/structure_mini/run_summary.json
      - name: Upload raw small-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-structure-real-small
          path: |
            /tmp/structure_044_pad
            /tmp/structure_mini
          if-no-files-found: warn
