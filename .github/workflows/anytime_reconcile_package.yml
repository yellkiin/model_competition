name: Publish reconciled source and comparison document
on:
  pull_request:
    branches: ['orion/track-anytime_wu']
    paths: ['.github/workflows/anytime_reconcile_package.yml']
permissions:
  contents: write
jobs:
  package:
    if: github.event.pull_request.head.ref == 'orion/anytime-reconcile-20260925-1012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research_a_orion_track_anytime
      - name: Package existing source and results, without re-running algorithms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,zipfile,subprocess,urllib.request
          from pathlib import Path
          repo='yellkiin/model_competition'
          tag='anytime-reconcile-20260925-1012'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+path,headers=headers)) as r:return json.load(r)
          release=get('/releases/tags/'+tag)
          target=Path('/tmp/Anytime_PR34_reconciliation_complete_20260925.zip')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(Path('research_a_orion_track_anytime').rglob('*')):
                  if f.is_file() and '__pycache__' not in f.parts:z.write(f,str(f))
              z.writestr('DELIVERY_SOURCE.json',json.dumps({'package_commit':commit,'peer_commit':'27f7aa073bd7f91a1b1b9842eb2c9eb48117bf37','experiment_commit':'404b9d31cbb8bf86f281e5add5dc0ab6f05a1c8d','experiment_run':36123440945,'packaging_run':os.environ['GITHUB_RUN_ID'],'new_experiments_in_packaging':0,'missing_original_v4_v5_not_recovered':True},indent=2))
          existing=next((a for a in release['assets'] if a['name']==target.name),None)
          if existing:raise RuntimeError('Refusing to overwrite an existing final archive')
          req=urllib.request.Request('https://uploads.github.com/repos/'+repo+'/releases/'+str(release['id'])+'/assets?name='+target.name,data=target.read_bytes(),headers={**headers,'Content-Type':'application/zip'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as r:asset=json.load(r)
          Path('/tmp/final_package_publication.json').write_text(json.dumps({'release_url':release['html_url'],'asset_id':asset['id'],'name':asset['name'],'size':asset['size'],'state':asset['state'],'url':asset['browser_download_url'],'source_commit':commit,'new_experiments':0},indent=2))
          print('Published',asset['name'],asset['size'],asset['state'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-anytime-reconciliation-delivery
          path: |
            /tmp/Anytime_PR34_reconciliation_complete_20260925.zip
            /tmp/final_package_publication.json
          if-no-files-found: error
