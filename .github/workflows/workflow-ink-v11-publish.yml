name: Publish reviewed workflow ink v11
on:
  push:
    branches:
      - figures/workflow-v11-cache-labels-20260927
    paths:
      - paper_a_figures/engraved_workflow/ink_v11/**
      - .github/workflows/workflow-ink-v11-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            paper_a_figures/engraved_workflow/ink_v9
            paper_a_figures/engraved_workflow/ink_v11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vector export and verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape
          python -m pip install fonttools==4.63.0 pymupdf==1.26.7 pillow==12.3.0
      - name: Build all four palettes and verify actual exports
        run: |
          python paper_a_figures/engraved_workflow/ink_v11/build.py --all
          python paper_a_figures/engraved_workflow/ink_v11/verify.py
          python paper_a_figures/engraved_workflow/ink_v11/review.py
      - name: Commit generated figures and review records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f paper_a_figures/engraved_workflow/ink_v11/assets paper_a_figures/engraved_workflow/ink_v11/exports
          git add paper_a_figures/engraved_workflow/ink_v11/docs
          git commit -m 'fig(A): publish verified ink_v11 cache labels in all four palettes'
          git push origin HEAD:figures/workflow-v11-cache-labels-20260927
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-ink-v11-reviewed
          include-hidden-files: true
          path: |
            paper_a_figures/engraved_workflow/ink_v11/
            !paper_a_figures/engraved_workflow/ink_v11/__pycache__/
