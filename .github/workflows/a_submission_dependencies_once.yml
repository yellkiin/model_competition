name: Export exact A portfolio dependencies
on:
  push:
    branches: [delivery/a-paper-attachments-20260927]
    paths: [.github/workflows/a_submission_dependencies_once.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d421c7e5fc1c2d8fd9d85ae29902b2f97462459f
          lfs: false
          sparse-checkout: |
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v1/求解
            题目/A题
      - name: Export only the specified dependencies and official docs
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root=Path('20hw_myskill_distribution/20hw_myskill_distribution/workshop_v1/求解')
          names=['solve_bands.py','solve_components.py','solve_batches.py','verify_official_results.py']
          with zipfile.ZipFile('a_dependencies.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:z.write(root/name,'legacy_solvers/'+name)
              attachment=next(Path('题目/A题').glob('*附件'))
              for p in (attachment/'docs').rglob('*'):
                  if p.is_file():z.write(p,'official/docs/'+p.relative_to(attachment/'docs').as_posix())
              if (attachment/'README.md').is_file():z.write(attachment/'README.md','official/README.md')
      - uses: actions/upload-artifact@v4
        with:
          name: a-exact-portfolio-dependencies
          path: a_dependencies.zip
          retention-days: 7
