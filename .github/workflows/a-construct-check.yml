name: A construction mathematics
on:
  push:
    branches: [research/a-construct-certify]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  requirements-and-math:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Read original A requirements
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as E
          p = next(Path('题目/A题').glob('*.docx'))
          with ZipFile(p) as z:
              root = E.fromstring(z.read('word/document.xml'))
          w = '{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
          m = '{http://schemas.openxmlformats.org/officeDocument/2006/math}'
          for i, para in enumerate(root.iter(w+'p'), 1):
              text = ''.join(n.text or '' for n in para.iter() if n.tag in (w+'t', m+'t'))
              if text.strip():
                  print(f'P{i:04d}: {text}')
      - name: Mathematical and official synthetic checks when implementation exists
        shell: bash
        run: |
          if [ -f research_a_next/test_math.py ]; then
            python -m unittest -v research_a_next.test_math
          fi
