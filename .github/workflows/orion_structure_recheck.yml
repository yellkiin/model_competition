name: ORION structure recheck final publication
on:
  pull_request:
    types: [edited]
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.pull_request.head.ref == 'orion/track-structure-recheck-20260925-0202'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orion/track-structure-recheck-20260925-0202
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research_a_orion_track_structure
            .github/workflows
      - name: Publish already-executed evidence and clean temporary transport
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import base64,io,lzma,tarfile
          root=Path.cwd();track=root/'research_a_orion_track_structure'
          parts=[track/'recheck_publication_part1.b64',track/'recheck_publication_part2.b64']
          encoded=''.join(p.read_text().strip() for p in parts)
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          allowed={'plugin_recheck.py','recheck_worker.py','summarize_recheck.py','plot_recheck.py','run_recheck_windows.ps1','RECHECK_README.md','LOCAL_AGENT_PROMPT.md','LITERATURE_RECHECK.md'}
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:') as archive:
              members=archive.getmembers()
              for member in members:
                  p=root/member.name
                  if not member.isfile() or not p.resolve().is_relative_to(track.resolve()):raise ValueError(member.name)
                  rel=p.relative_to(track)
                  if str(rel) not in allowed and not str(rel).startswith('results/recheck_20260925_review/'):raise ValueError(member.name)
              for member in members:
                  p=root/member.name;p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(archive.extractfile(member).read())
          print('Published',len(members),'source/report files; this step does not run an experiment.')
          for p in parts+[track/'recheck_source_bundle.b64',root/'.github/workflows/orion_structure_recheck.yml']:
              if p.exists():p.unlink()
          PY
          git config user.name 'orion-recheck-agent'
          git config user.email 'orion-recheck-agent@users.noreply.github.com'
          git add research_a_orion_track_structure
          git add -u .github/workflows/orion_structure_recheck.yml
          git diff --cached --quiet || git commit -m 'report(structure): independent real recheck, qualified claims and counterexamples'
          git push origin HEAD:orion/track-structure-recheck-20260925-0202
