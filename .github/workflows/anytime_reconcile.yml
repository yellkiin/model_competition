name: Anytime reconciliation matched real experiments
on:
  pull_request:
    branches: ['orion/track-anytime_wu']
    paths: ['.github/workflows/anytime_reconcile.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytime-reconcile-20260925-1012
  cancel-in-progress: false
jobs:
  freeze:
    if: github.event.pull_request.head.ref == 'orion/anytime-reconcile-20260925-1012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.freeze.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research_a_orion_track_anytime
      - id: freeze
        run: |
          set -euo pipefail
          python research_a_orion_track_anytime/reconcile_materialize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_a_orion_track_anytime/reconcile_runner.py
          git commit -m 'build(anytime): freeze additive reconciliation runner before real experiments'
          git push origin HEAD:orion/anytime-reconcile-20260925-1012
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  measured:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ['001','024','044','059','083','084','086']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.commit }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research_a_orion_track_anytime
      - uses: actions/download-artifact@v4
        with:
          name: orion-anytime-wu-frozen-inputs
          run-id: 36104651803
          github-token: ${{ github.token }}
          path: /tmp/input
      - name: Restore immutable official and public source only
        run: |
          python -m pip install --user psutil==7.0.0
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/input/orion_anytime_wu_frozen.zip') as z:
              for name in z.namelist():
                  if name.startswith(('research_a_orion_anytime/','raw_day01/','题目/A题/')):
                      z.extract(name,'.')
          PY
      - name: Fresh official seed and matched five-core Q3 continuation
        run: |
          set -euo pipefail
          ROOT=/tmp/reconcile_${{ matrix.case }}
          python -u -m research_a_orion_track_anytime.reconcile_prepare --cases ${{ matrix.case }} --questions 3 --cores 5 --out "$ROOT/preparation"
          python -u -m research_a_orion_track_anytime.reconcile_runner --cases ${{ matrix.case }} --questions 3 --cores 5 --modes warm --seconds 30 --max-evaluations 16 --total-seconds 240 --pair-seconds 30 --workers 1 --seed-manifest "$ROOT/preparation/seed_manifest.json" --out "$ROOT/warm"
      - name: Matched cold comparison of stage-order regressions
        if: contains(fromJSON('["044","083","084"]'), matrix.case)
        run: |
          ROOT=/tmp/reconcile_${{ matrix.case }}
          python -u -m research_a_orion_track_anytime.reconcile_runner --cases ${{ matrix.case }} --questions 3 --cores 5 --modes cold --seconds 30 --max-evaluations 16 --total-seconds 240 --pair-seconds 30 --workers 1 --seed-manifest "$ROOT/preparation/seed_manifest.json" --out "$ROOT/cold"
      - name: Bound-stop same-seed comparison
        if: contains(fromJSON('["001","059"]'), matrix.case)
        run: |
          set -euo pipefail
          ROOT=/tmp/reconcile_${{ matrix.case }}
          N=5; if [ '${{ matrix.case }}' = '001' ]; then N=3; fi
          python -u -m research_a_orion_track_anytime.reconcile_prepare --cases ${{ matrix.case }} --questions 2 --cores $N --out "$ROOT/bound_preparation"
          python -u -m research_a_orion_track_anytime.reconcile_runner --cases ${{ matrix.case }} --questions 2 --cores $N --modes warm --seconds 30 --max-evaluations 16 --total-seconds 180 --pair-seconds 30 --workers 1 --seed-manifest "$ROOT/bound_preparation/seed_manifest.json" --out "$ROOT/bound"
      - name: Preserve actually executed source and completeness markers
        if: always()
        run: |
          mkdir -p /tmp/reconcile_${{ matrix.case }}/source
          cp research_a_orion_track_anytime/*.py /tmp/reconcile_${{ matrix.case }}/source/
          echo '${{ needs.freeze.outputs.commit }}' > /tmp/reconcile_${{ matrix.case }}/EXECUTION_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconcile-case-${{ matrix.case }}
          path: /tmp/reconcile_${{ matrix.case }}
          if-no-files-found: error
          compression-level: 6
  collect:
    needs: [freeze, measured]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orion/anytime-reconcile-20260925-1012
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research_a_orion_track_anytime
      - uses: actions/download-artifact@v4
        with:
          pattern: reconcile-case-*
          path: /tmp/reconcile_download
      - name: Validate raw selected records and archive evidence in private repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: orion/anytime-reconcile-20260925-1012
        run: python research_a_orion_track_anytime/reconcile_publish.py
      - name: Commit complete results, never change peer branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_a_orion_track_anytime/results/reconcile_20260925_1012
          git commit -m 'results(anytime): commit matched evidence, all outcomes and private Release archive index'
          git push origin HEAD:orion/anytime-reconcile-20260925-1012
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/anytime_reconcile_code_results.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in Path('research_a_orion_track_anytime').rglob('*'):
                  if f.is_file() and '__pycache__' not in f.parts:z.write(f,str(f))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anytime-reconciled-code-and-results
          path: /tmp/anytime_reconcile_code_results.zip
          if-no-files-found: warn
