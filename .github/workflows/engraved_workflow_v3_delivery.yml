name: Engraved workflow v3 delivery
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/engraved_workflow_v3_delivery.yml
      - paper_a_figures/engraved_workflow/ink_v3/**
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.ref == 'figures/engraved-workflow-v3-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70d4888886cd9f77037f7b010ce0241349ef056d
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            paper_a_figures/engraved_workflow/ink_v2/assets
            paper_a_figures/engraved_workflow/ink_v2/docs
      - name: Package only the requested second-version source
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          base=Path('paper_a_figures/engraved_workflow/ink_v2')
          with zipfile.ZipFile('/tmp/engraved_v2_exact_inputs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted((base/'assets').glob('*.svg')): z.write(p,p.relative_to(base))
              for p in sorted((base/'docs').glob('*.md')): z.write(p,p.relative_to(base))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: engraved-v2-exact-inputs
          path: /tmp/engraved_v2_exact_inputs.zip
          if-no-files-found: error
