name: Engraved workflow v3 delivery
on:
  push:
    branches: [figures/engraved-workflow-v3-20260926]
    paths:
      - .github/workflows/engraved_workflow_v3_delivery.yml
      - paper_a_figures/engraved_workflow/ink_v3/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/engraved_workflow_v3_delivery.yml
      - paper_a_figures/engraved_workflow/ink_v3/**
permissions:
  contents: write
concurrency:
  group: engraved-workflow-v3-publication
  cancel-in-progress: false
jobs:
  render:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/figures/engraved-workflow-v3-20260926') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'figures/engraved-workflow-v3-20260926' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            paper_a_figures/engraved_workflow/ink_v2/assets
            paper_a_figures/engraved_workflow/ink_v3
      - name: Install local vector renderer and paper-compatible fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape fonts-noto-cjk fonts-noto-core fonts-stix fonts-liberation2 poppler-utils python3-pil
      - name: Generate figure files and verify vector structure
        env:
          SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python paper_a_figures/engraved_workflow/ink_v3/build.py --svg-only
          python paper_a_figures/engraved_workflow/ink_v3/finalize_v3.py
          python - <<'PY'
          import json,os,subprocess,xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image
          root=Path('paper_a_figures/engraved_workflow/ink_v3')
          (root/'.gitignore').write_text('__pycache__/\n*.pyc\n')
          (root/'.gitattributes').write_text('*.svg text eol=lf\n*.svgz -filter -diff -merge\n*.pdf -filter -diff -merge\n*.png -filter -diff -merge\n')
          ns={'s':'http://www.w3.org/2000/svg'};checks=[]
          for name in ['mono','qinglu']:
              svg=root/'assets'/f'workflow_{name}_v3.svg';r=ET.parse(svg).getroot()
              ids=[e.get('id') for e in r.iter() if e.get('id')]
              texts=[''.join(t.itertext()) for t in r.findall('.//s:text',ns)]
              links=[e for e in r.iter() if e.get('data-source')]
              assert len(ids)==len(set(ids)) and not r.findall('.//s:image',ns)
              assert len(links)==5 and r.find('.//*[@id="legend"]') is None
              assert not any('字典序' in t or 'Step1' in t or '停止？' in t or '固定同一方案' in t for t in texts)
              assert r.find('.//*[@id="graph-definition"]') is not None
              for ident in ['text-024','text-031','text-063','text-114']:
                  assert 'white' not in (r.find(f'.//*[@id="{ident}"]').get('class') or '')
              for ident in ['text-104','text-113']:
                  label=r.find(f'.//*[@id="{ident}"]')
                  assert len(label.findall('s:tspan',ns))==2
              for ident,x in [('text-122','2190'),('text-123','2821')]:
                  label=r.find(f'.//*[@id="{ident}"]')
                  assert label.get('x')==x and label.get('text-anchor')=='middle'
              formula=r.find('.//*[@id="makespan-v3"]')
              assert formula is not None and all((c.tail or '')=='' for c in list(formula))
              png=root/'exports'/f'workflow_{name}_v3.png'
              assert Image.open(png).size==(6000,3650)
              assert (root/'exports'/f'workflow_{name}_v3.pdf').read_bytes().startswith(b'%PDF-')
              checks.append({'palette':name,'svg_text_objects':len(texts),'concept_links':len(links),'png_size':[6000,3650],
                  'font_alignment':'Times/SimSun compatible + STIX math','b_blocks_uniform':True,'alignment_fixes_verified':True})
          receipt={'source_commit':os.environ['SOURCE_COMMIT'],'v2_input_commit':'70d4888886cd9f77037f7b010ce0241349ef056d','workflow_run':os.environ['GITHUB_RUN_ID'],'renderer':subprocess.check_output(['inkscape','--version'],text=True).strip(),'checks':checks,'scope':'vector rendering and file publication, not solver experiments','new_experiments':0,'visual_review':'performed separately after downloading actual exported previews'}
          (root/'docs/EXPORT_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          PY
          pdftoppm -scale-to 1800 -singlefile -png paper_a_figures/engraved_workflow/ink_v3/exports/workflow_mono_v3.pdf /tmp/pdf_mono_review
          pdftoppm -scale-to 1800 -singlefile -png paper_a_figures/engraved_workflow/ink_v3/exports/workflow_qinglu_v3.pdf /tmp/pdf_qinglu_review
      - name: Commit only the third version and package the full delivery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper_a_figures/engraved_workflow/ink_v3
          if ! git diff --cached --quiet; then
            git commit -m 'fig(A): regenerate v3 after typography and alignment fixes'
            git push origin HEAD:figures/engraved-workflow-v3-20260926
          fi
          python - <<'PY'
          from pathlib import Path
          import zipfile,subprocess
          root=Path('paper_a_figures/engraved_workflow/ink_v3')
          with zipfile.ZipFile('/tmp/Figure_1_1_ink_v3_complete.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and '__pycache__' not in p.parts:z.write(p,p.relative_to(root))
              z.writestr('PACKAGE_COMMIT.txt',subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: figure-1-1-ink-v3-complete
          path: |
            /tmp/Figure_1_1_ink_v3_complete.zip
            /tmp/pdf_mono_review.png
            /tmp/pdf_qinglu_review.png
          if-no-files-found: error
