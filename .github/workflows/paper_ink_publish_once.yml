name: Publish reviewed whole-paper ink figures
on:
  push:
    branches: ['figures/paper-wide-ink-style-20260927']
    paths: ['.github/workflows/paper_ink_publish_once.yml']
permissions:
  contents: write
concurrency:
  group: paper-ink-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            .github/paper-ink-transfer
            .github/workflows
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/论文
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/数据/l2_patch_60_62
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/提交附件/支撑材料文件/问题一/源码
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/提交附件/支撑材料文件/问题二/源码
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/提交附件/支撑材料文件/问题三/源码
            paper_a_figures/ink_engraving_agent
            各种建模agent/MathModelAgent/backend/fonts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact locally reviewed source and prose
        shell: pwsh
        run: '& "$env:pythonLocation\python.exe" .github/paper-ink-transfer/launch.py apply'
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: actions/cache/restore@v4
        with:
          path: C:/Users/runneradmin/AppData/Roaming/TinyTeX
          key: paper-native-tex-20260927-explicit-v2
      - name: Install only figure and typesetting tools
        shell: pwsh
        run: |
          & "$env:pythonLocation\python.exe" -m pip install --quiet matplotlib==3.10.8 numpy pandas PyMuPDF fonttools latexminted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install inkscape --no-progress -y
          if ($LASTEXITCODE -notin @(0,1641,3010)) { exit $LASTEXITCODE }
          tlmgr install xetex fandol lm tex-gyre latexmk algorithmicx algorithms amsfonts amsmath appendix auxhook bigfoot bigintcalc bitset booktabs caption catchfile colortbl cprotect ctex enumitem environ etexcmds etoolbox fancyvrb float fontspec fvextra geometry gettitlestring graphics hycolor hyperref iftex infwarerr intcalc kvdefinekeys kvoptions kvsetkeys latex2pydata lineno listings ltxcmds makecell mdframed minted multirow natbib needspace pdfcol pdfescape pdftexcmds pgf pgfopts placeins refcount rerunfilecheck setspace siunitx stringenc subfig tcolorbox tikzfill titlesec tocloft tools translations trimspaces ulem uniquecounter upquote url xcolor xecjk xurl zhnumber zref ifplatform xstring xkeyval
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce figures, compile current manuscript and commit outputs
        shell: pwsh
        run: '& "$env:pythonLocation\python.exe" .github/paper-ink-transfer/launch.py publish'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-paper-ink-final-review
          path: paper-ink-output/
          retention-days: 7
          if-no-files-found: warn
