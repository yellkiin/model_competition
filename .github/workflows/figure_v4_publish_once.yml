name: Publish locally edited Figure 1.1 v4
on:
  push:
    branches: ['figures/workflow-v4-14-annotations-20260927']
    paths: ['paper_a_figures/engraved_workflow/ink_v4/PUBLISH.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-vector-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          lfs: false
          sparse-checkout: |
            paper_a_figures/engraved_workflow/ink_v3/assets
            paper_a_figures/engraved_workflow/ink_v4
            paper_a_figures/ink_engraving_agent/palettes.json
            .github/workflows
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install only the vector export tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends inkscape
      - name: Reproduce the completed local vector revision and all four exports
        run: |
          python paper_a_figures/engraved_workflow/ink_v4/build.py --all --png-width 6000
          python paper_a_figures/engraved_workflow/ink_v4/verify.py
          python - <<'PY'
          from pathlib import Path
          import struct
          p = Path('paper_a_figures/engraved_workflow/ink_v4')
          for theme in ('qinglu', 'qianjiang', 'yanlan', 'mono'):
              for suffix in ('.svg', '.svgz', '_editable.svg'):
                  assert (p/'assets'/('workflow_'+theme+'_v4'+suffix)).is_file()
              for suffix in ('.pdf', '.png', '_preview.png'):
                  assert (p/'exports'/('workflow_'+theme+'_v4'+suffix)).is_file()
              image = (p/'exports'/('workflow_'+theme+'_v4.png')).read_bytes()
              assert struct.unpack('>II', image[16:24]) == (6000,2860)
          PY
      - name: Commit complete outputs and remove this one-use publication workflow
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f paper_a_figures/engraved_workflow/ink_v4/assets paper_a_figures/engraved_workflow/ink_v4/exports paper_a_figures/engraved_workflow/ink_v4/docs/OBJECT_REVIEW.json
          git rm .github/workflows/figure_v4_publish_once.yml
          git commit -m 'fig(A): publish four complete v4 palettes and remove one-use exporter'
          git push origin "HEAD:$BRANCH_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: figure-1-1-v4-four-palettes
          path: paper_a_figures/engraved_workflow/ink_v4/
          include-hidden-files: true
          retention-days: 30
