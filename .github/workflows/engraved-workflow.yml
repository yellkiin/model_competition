name: Engraved workflow figure
on:
  pull_request:
    paths:
      - 'paper_a_figures/engraved_workflow/**'
      - '.github/workflows/engraved-workflow.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: paper_a_figures/engraved_workflow
          sparse-checkout-cone-mode: true
          lfs: false
          persist-credentials: false
      - name: Install vector renderer and CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y inkscape fonts-noto-cjk fonts-stix poppler-utils
      - name: Build and validate
        run: python3 paper_a_figures/engraved_workflow/build.py
      - name: Check PDF text and page
        run: |
          pdfinfo paper_a_figures/engraved_workflow/exports/workflow.pdf
          pdftotext paper_a_figures/engraved_workflow/exports/workflow.pdf - | grep 'Makespan'
      - uses: actions/upload-artifact@v4
        with:
          name: engraved-workflow-editable-and-exports
          path: |
            paper_a_figures/engraved_workflow/assets/
            paper_a_figures/engraved_workflow/exports/
          retention-days: 30
