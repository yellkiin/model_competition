name: Export bound A submission materials
on:
  push:
    branches: [delivery/a-paper-attachments-20260927]
    paths: [.github/workflows/a_submission_intake_20260927.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          ref: d421c7e5fc1c2d8fd9d85ae29902b2f97462459f
          sparse-checkout: |
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/提交附件
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/论文
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/论文理论
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/线刻图件
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/规范化数据/combined
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/规范化数据/studies
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/总体/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题一/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题二/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题三/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/数据/l2_patch_60_62
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/题目
            L2提升
            research_a_orion_trident
      - name: Archive current files without running any experiment
        shell: python
        run: |
          from pathlib import Path
          import subprocess, zipfile, json, collections
          ws='20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/'
          support=ws+'提交附件/支撑材料文件/'
          root=Path.cwd(); out=root/'submission-intake'; out.mkdir()
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          groups=collections.defaultdict(list); inventory=[]
          for name in files:
              p=root/name
              if not name or not p.is_file() or p.is_symlink(): continue
              if p.suffix.lower() in {'.ttf','.ttc','.otf','.woff','.woff2'}: continue
              if '__pycache__' in p.parts or p.suffix=='.pyc': continue
              if name.startswith(support+'其他支撑材料/已选评价/'):
                  tail=name.split('/已选评价/',1)[1]
                  group=next(('selected_'+s for s in ('shard0','shard1','shard2') if tail.startswith(s+'/')),'source_bundle')
              elif name.startswith(support+'其他数据/'):
                  group='official_bundle'
              elif name.startswith('L2提升/'):
                  group='l2_bundle'
              elif name.startswith('research_a_orion_trident/'):
                  if len(p.parts)>2 or p.suffix not in {'.py','.md','.json','.csv','.ps1','.txt'}: continue
                  group='source_bundle'
              elif name.startswith(ws):
                  if '/数据/原始/' in name or name.endswith('工作区清单.json') or p.name.startswith('网页端论文编辑包'): continue
                  group='source_bundle'
              else: continue
              groups[group].append(name); inventory.append({'path':name,'bytes':p.stat().st_size,'group':group})
          for group,names in groups.items():
              target=out/(group+'.zip')
              with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=5,allowZip64=True) as z:
                  for name in sorted(names): z.write(root/name,name)
              print(group,len(names),target.stat().st_size,flush=True)
          (out/'inventory.json').write_text(json.dumps({'source_commit':'d421c7e5fc1c2d8fd9d85ae29902b2f97462459f','files':inventory},ensure_ascii=False),encoding='utf8')
      - uses: actions/upload-artifact@v4
        with:
          name: a-submission-sources
          path: |
            submission-intake/source_bundle.zip
            submission-intake/inventory.json
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: a-submission-official
          path: submission-intake/official_bundle.zip
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: a-submission-selected-0
          path: submission-intake/selected_shard0.zip
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: a-submission-selected-1
          path: submission-intake/selected_shard1.zip
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: a-submission-selected-2
          path: submission-intake/selected_shard2.zip
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: a-submission-l2
          path: submission-intake/l2_bundle.zip
          retention-days: 7
          compression-level: 0
