name: Export ink v3 figure
on:
  push:
    branches: [figures/ink-v3-conceptual-20260926]
    paths:
      - paper_a_figures/engraved_workflow/ink_v3/build.py
      - .github/workflows/render-ink-v3-once.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figures/ink-v3-conceptual-20260926
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            paper_a_figures/engraved_workflow/ink_v3
      - name: Install local vector renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends inkscape fonts-noto-cjk
      - name: Generate figure and export PDF and PNG
        run: python3 paper_a_figures/engraved_workflow/ink_v3/build.py
      - name: Record export files
        run: |
          python3 - <<'PY'
          import hashlib, json, struct, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('paper_a_figures/engraved_workflow/ink_v3')
          s=ET.parse(p/'assets/workflow_v3.svg').getroot()
          ns={'s':'http://www.w3.org/2000/svg'}
          assert not s.findall('.//s:image',ns)
          flow=s.find(".//s:g[@id='main-flow']",ns)
          assert len(flow.findall('s:path',ns))==4
          data=(p/'exports/workflow_v3.png').read_bytes()
          assert struct.unpack('>II',data[16:24])==(4252,2244)
          assert (p/'exports/workflow_v3.pdf').read_bytes().startswith(b'%PDF-')
          result={'status':'exported','visual_review':'not granted by this machine record','renderer':subprocess.check_output(['inkscape','--version'],text=True).strip(),'font':subprocess.check_output(['fc-match','Noto Sans CJK SC'],text=True).strip(),'files':[]}
          for f in sorted(list((p/'assets').glob('*'))+list((p/'exports').glob('*'))):
              b=f.read_bytes(); result['files'].append({'path':str(f.relative_to(p)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (p/'docs/EXPORT_MANIFEST.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish only generated third-version files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- paper_a_figures/engraved_workflow/ink_v3/assets paper_a_figures/engraved_workflow/ink_v3/exports paper_a_figures/engraved_workflow/ink_v3/docs/EXPORT_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'figures: export ink v3 SVG, vector PDF and PNG [skip ci]'
            git push origin HEAD:figures/ink-v3-conceptual-20260926
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ink-v3-complete
          path: paper_a_figures/engraved_workflow/ink_v3
          retention-days: 7
