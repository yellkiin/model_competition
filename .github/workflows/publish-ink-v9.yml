name: Publish reviewed ink v9
on:
  push:
    branches: [figures/workflow-v9-clean-memory-20260927]
    paths:
      - .github/workflows/publish-ink-v9.yml
      - paper_a_figures/engraved_workflow/ink_v9/build.py
      - paper_a_figures/engraved_workflow/ink_v9/prepare_from_v8.py
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /paper_a_figures/engraved_workflow/ink_v8/
            /paper_a_figures/engraved_workflow/ink_v9/
            /.github/workflows/publish-ink-v9.yml
      - name: Install vector export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape
          python -m pip install pymupdf pillow
      - name: Rebuild and verify the four reviewed palettes
        run: |
          D=paper_a_figures/engraved_workflow/ink_v9
          python "$D/prepare_from_v8.py"
          python "$D/build.py" --all
          python "$D/verify.py"
          python "$D/pixel_check.py"
          python "$D/review.py"
      - name: Commit only the ninth-version deliverables
        run: |
          D=paper_a_figures/engraved_workflow/ink_v9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$D"
          git diff --cached --name-only | python -c "import sys; p=list(sys.stdin); assert p and all(x.startswith('paper_a_figures/engraved_workflow/ink_v9/') for x in p)"
          git commit -m 'fig(A): publish ink_v9 clean memory faces, four palettes and PR69 prose'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-ink-v9-reviewed
          include-hidden-files: true
          retention-days: 30
          path: |
            paper_a_figures/engraved_workflow/ink_v9/
            !paper_a_figures/engraved_workflow/ink_v9/**/__pycache__/**
