name: A Aurora isolated verification
on:
  push:
    branches: [feat/a-aurora-constrained-20260923]
    paths: ['research_a_aurora/**', '.github/workflows/a-aurora-verify.yml']
  pull_request:
    paths: ['research_a_aurora/**', '.github/workflows/a-aurora-verify.yml']
permissions:
  contents: read
concurrency:
  group: a-aurora-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.5'
      - name: Prepare bounded diagnostic sources
        shell: python
        run: |
          from pathlib import Path
          import zipfile, xml.etree.ElementTree as ET, shutil, subprocess
          root = Path.cwd()
          source = root / '\u9898\u76ee' / 'A\u9898'
          out = root / 'aurora_ci_reference'
          out.mkdir(exist_ok=True)
          for doc in source.glob('*.docx'):
              with zipfile.ZipFile(doc) as z:
                  tree = ET.fromstring(z.read('word/document.xml'))
              ns = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
              text = '\n'.join(''.join(p.itertext()) for p in tree.findall('.//w:p', ns))
              (out / 'problem_statement.txt').write_text(text, encoding='utf-8')
          cases = (1, 2, 16, 44, 59, 83)
          for directory in source.iterdir():
              if directory.is_dir() and (directory / 'code').is_dir():
                  paths = [directory / 'data' / f'case_{i:03d}.json' for i in cases]
                  includes = ','.join(p.relative_to(root).as_posix() for p in paths)
                  subprocess.run(['git', 'lfs', 'pull', '--include=' + includes, '--exclude='], check=True, timeout=180)
                  shutil.copytree(directory / 'code', out / 'code', dirs_exist_ok=True)
                  shutil.copytree(directory / 'docs', out / 'docs', dirs_exist_ok=True)
                  shutil.copy2(directory / 'README.md', out / 'README.md')
                  shutil.copy2(directory / 'data' / 'config.txt', out / 'config.txt')
                  (out / 'data').mkdir(exist_ok=True)
                  for p in paths:
                      if p.read_bytes().startswith(b'version https://git-lfs'):
                          raise RuntimeError('LFS data unavailable: ' + str(p))
                      shutil.copy2(p, out / 'data' / p.name)
          papers = root / '\u8c03\u7814' / 'A\u9898_\u6587\u732e\u5e93' / 'pdf'
          (out / 'reading').mkdir(exist_ok=True)
          for prefix in ('A49_', 'A39_', 'A02_', 'A16_', 'A42_'):
              for p in papers.glob(prefix + '*.pdf'):
                  shutil.copy2(p, out / 'reading' / p.name)
          print('Prepared six purpose-selected diagnostic cases; not a representative full benchmark.')
      - name: Run Aurora tests when implementation is present
        shell: pwsh
        run: |
          if (Test-Path research_a_aurora/test_aurora.py) {
            python -m unittest research_a_aurora.test_aurora -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a-aurora-reference-and-verification
          path: |
            aurora_ci_reference
            research_a_aurora/ci_results
          retention-days: 3
