name: Archive existing ORION result files
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths: ['.github/workflows/orion_results_archive.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orion-existing-results-server-archive-20260925
  cancel-in-progress: false
jobs:
  archive:
    if: github.event.pull_request.head.ref == 'orion/archive-structure-results-20260925-0455' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research_a_orion_track_structure/results/publication_20260925_0455
      - name: Archive existing artifacts and restore exact uploaded CSVs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research_a_orion_track_structure/results/publication_20260925_0455/archive_publish.py
