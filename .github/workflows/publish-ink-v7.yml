name: Publish reviewed workflow ink v7
on:
  push:
    branches:
      - figures/workflow-v7-layout-arrows-20260927
    paths:
      - .github/workflows/publish-ink-v7.yml
      - paper_a_figures/engraved_workflow/ink_v7/build.py
      - paper_a_figures/engraved_workflow/ink_v7/verify.py
permissions:
  contents: write
concurrency:
  group: publish-ink-v7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            paper_a_figures/engraved_workflow/ink_v6
            paper_a_figures/engraved_workflow/ink_v7
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vector export and review dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape
          python -m pip install pymupdf==1.26.7 pillow
      - name: Reproduce four reviewed palettes and inspect all objects
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python paper_a_figures/engraved_workflow/ink_v7/build.py --all
          python paper_a_figures/engraved_workflow/ink_v7/verify.py
          python paper_a_figures/engraved_workflow/ink_v7/review.py
          git diff --exit-code -- paper_a_figures/engraved_workflow/ink_v6
      - name: Archive the actual reviewed release
        uses: actions/upload-artifact@v4
        with:
          name: workflow-ink-v7-reviewed
          path: paper_a_figures/engraved_workflow/ink_v7/
          include-hidden-files: true
          retention-days: 30
      - name: Commit generated files and remove this one-time publisher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-ink-v7.yml
          git add paper_a_figures/engraved_workflow/ink_v7
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              assert path.startswith('paper_a_figures/engraved_workflow/ink_v7/') or path == '.github/workflows/publish-ink-v7.yml', path
              assert not path.lower().endswith(('.ttf', '.otf', '.woff', '.woff2', '.ttc')), path
          PY
          git commit -m 'fig(A): publish reviewed ink_v7 four-color workflow and PR69 prose'
          git push origin HEAD:"${GITHUB_REF_NAME}"
