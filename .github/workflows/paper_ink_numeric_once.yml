name: Export bound figure tables
on:
  push:
    branches: ['figures/paper-wide-ink-style-20260927']
    paths: ['.github/workflows/paper_ink_numeric_once.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/规范化数据/combined
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/规范化数据/studies
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/结构图源码
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/数据/l2_patch_60_62
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/题目
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/支撑材料源/方法源码
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/支撑材料源/官方评价代码
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          w=Path('20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2')
          dirs=['求解/规范化数据/combined','求解/规范化数据/studies','求解/结构图源码','数据/l2_patch_60_62','题目','求解/支撑材料源/方法源码','求解/支撑材料源/官方评价代码']
          with zipfile.ZipFile('paper_bound_tables.zip','w',zipfile.ZIP_DEFLATED) as z:
              for rel in dirs:
                  for p in (w/rel).rglob('*'):
                      if p.is_file() and '__pycache__' not in p.parts and p.stat().st_size<20000000:z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-bound-numeric-tables
          path: paper_bound_tables.zip
          retention-days: 7
