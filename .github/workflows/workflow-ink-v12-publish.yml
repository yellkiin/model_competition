name: Publish reviewed workflow ink v12
on:
  push:
    branches:
      - figures/workflow-v12-a4-uniform-20260927
    paths:
      - paper_a_figures/engraved_workflow/ink_v12/build.py
      - .github/workflows/workflow-ink-v12-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            paper_a_figures/engraved_workflow/ink_v11
            paper_a_figures/engraved_workflow/ink_v12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vector export and verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape
          python -m pip install pymupdf==1.26.7 pillow==12.3.0
      - name: Build and verify all four A4 palettes
        run: |
          python paper_a_figures/engraved_workflow/ink_v12/build.py
          cmp paper_a_figures/engraved_workflow/ink_v12/docs/EXPECTED_LOCAL_SVG_SHA256.json paper_a_figures/engraved_workflow/ink_v12/docs/REVIEWED_SVG_SHA256.json
      - name: Commit generated figures and review records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f paper_a_figures/engraved_workflow/ink_v12/assets paper_a_figures/engraved_workflow/ink_v12/exports
          git add paper_a_figures/engraved_workflow/ink_v12/docs
          git diff --cached --quiet || git commit -m 'fig(A): publish verified ink_v12 uniform A4 figures in all four palettes'
          git push origin HEAD:figures/workflow-v12-a4-uniform-20260927
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-ink-v12-reviewed
          include-hidden-files: true
          path: |
            paper_a_figures/engraved_workflow/ink_v12/
            !paper_a_figures/engraved_workflow/ink_v12/__pycache__/
