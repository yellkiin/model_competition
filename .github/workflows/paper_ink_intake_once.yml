name: Export current paper for local ink styling
on:
  push:
    branches: ['figures/paper-wide-ink-style-20260927']
    paths: ['.github/workflows/paper_ink_intake_once.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2
            paper_a_figures
      - name: Archive existing manuscript, drawings and numeric inputs only
        shell: bash
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          w=Path('20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2')
          records=[]; chosen=[]
          for root in (w,Path('paper_a_figures')):
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  size=p.stat().st_size
                  records.append({'path':str(p),'bytes':size})
                  rel=p.relative_to(w).parts if p.is_relative_to(w) else ()
                  suffix=p.suffix.lower()
                  yes=False
                  if rel and rel[0]=='论文':
                      yes=suffix in ('.tex','.sty','.cls','.bst','.bib','.pdf','.svg','.png','.jpg','.md','.csv','.json')
                  elif rel and rel[0]=='求解':
                      if len(rel)>1 and rel[1] in ('问题一','问题二','问题三'):
                          yes=suffix in ('.py','.csv','.json','.md','.pdf','.svg','.png','.tex') and size<12000000
                      elif len(rel)==2:
                          yes=suffix in ('.py','.csv','.json','.md','.tex')
                      elif '论文理论' in rel:
                          yes=suffix in ('.md','.json','.csv','.tex') and size<2000000
                  elif rel and len(rel)==1:
                      yes=suffix in ('.json','.md','.txt')
                  elif not rel:
                      yes=suffix in ('.py','.json','.md','.svg','.svgz','.pdf','.png','.tex') and size<12000000
                  if yes and '__pycache__' not in p.parts: chosen.append(p)
          Path('export').mkdir(exist_ok=True)
          Path('export/repository_files.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf8')
          with zipfile.ZipFile('export/paper_current_inputs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in chosen:z.write(p,str(p))
          print('selected files',len(chosen),'bytes',sum(p.stat().st_size for p in chosen))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper67-current-source-and-plotting-inputs
          path: export/
          retention-days: 7
