name: Trident source and recorded-data publication only
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research_a_orion_trident/publication/**'
      - '.github/workflows/trident_source_publication.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.head_ref == 'integration/orion-trident-publish-20260925' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/orion-trident-publish-20260925
          fetch-depth: 1
          lfs: false
          sparse-checkout: research_a_orion_trident
      - name: Copy exact frozen source and literal recorded data
        run: |
          python research_a_orion_trident/publication/materialize_sources.py
          python research_a_orion_trident/publication/materialize_evidence.py
      - name: Commit publication without running experiments
        run: |
          git add -- research_a_orion_trident
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(Trident): publish exact source and recorded plans/tables [skip ci]'
          git push origin HEAD:integration/orion-trident-publish-20260925
