name: Trident source publication only
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research_a_orion_trident/publication/derived_*.json'
      - 'research_a_orion_trident/publication/materialize_sources.py'
      - '.github/workflows/trident_source_publication.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.head_ref == 'integration/orion-trident-publish-20260925' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/orion-trident-publish-20260925
          fetch-depth: 1
          lfs: false
          sparse-checkout: research_a_orion_trident
      - name: Materialize exact previously delivered source
        run: python research_a_orion_trident/publication/materialize_sources.py
      - name: Commit publication, no experiments
        run: |
          git add -- research_a_orion_trident
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(Trident): materialize exact frozen source for delivery [skip ci]'
          git push origin HEAD:integration/orion-trident-publish-20260925
