name: Publish reviewed ink v8
on:
  push:
    branches: [figures/workflow-v8-copy-pairs-20260927]
    paths: [.github/workflows/publish-ink-v8.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            .github
            paper_a_figures/engraved_workflow/ink_v7
            paper_a_figures/engraved_workflow/ink_v8
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vector export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape
          python -m pip install pymupdf pillow
      - name: Build and verify all four palettes
        run: |
          D=paper_a_figures/engraved_workflow/ink_v8
          python "$D/build.py" --all
          python "$D/verify.py"
          python "$D/pixel_check.py"
          python "$D/review.py"
          find "$D" -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit only ink_v8 outputs to this branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          D=paper_a_figures/engraved_workflow/ink_v8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$D"
          if git diff --cached --name-only | grep -v '^paper_a_figures/engraved_workflow/ink_v8/'; then
            echo 'Unexpected staged path'; exit 1
          fi
          git commit -m 'fig(A): publish reviewed ink_v8 COPY pairs, four palettes and PR69 prose'
          git push origin "HEAD:$BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-ink-v8-reviewed
          path: paper_a_figures/engraved_workflow/ink_v8
          include-hidden-files: true
          retention-days: 30
