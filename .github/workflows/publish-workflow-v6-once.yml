name: Publish reviewed workflow v6
on:
  push:
    branches: [figures/workflow-v6-relations-six-operations-20260927]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            paper_a_figures/engraved_workflow/ink_v5
            paper_a_figures/engraved_workflow/ink_v6
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install vector export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape poppler-utils
          python -m pip install --disable-pip-version-check matplotlib==3.10.8 pymupdf pillow
      - name: Restore reviewed source text
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json
          root=Path('paper_a_figures/engraved_workflow/ink_v6')
          parts=[root/'_transfer'/f'{n}.b64' for n in ('0','1','2','3','4','5a','5b')]
          data=(''.join(p.read_text().strip() for p in parts)+'\n').encode()
          assert hashlib.sha256(data).hexdigest()=='cd472a0ef3623e39bebe430f644526692120ede6ec68c247354e827eb4704e47'
          payload=json.loads(gzip.decompress(base64.b64decode(data)))
          for rel,text in payload.items():
              path=root/rel
              assert path.resolve().is_relative_to(root.resolve())
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8')
          print('Restored',len(payload),'reviewed text files')
          PY
      - name: Rebuild all palettes and verify
        run: |
          python paper_a_figures/engraved_workflow/ink_v6/build.py --all
          python paper_a_figures/engraved_workflow/ink_v6/verify.py
          python paper_a_figures/engraved_workflow/ink_v6/review.py
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('paper_a_figures/engraved_workflow/ink_v6')
          expected=json.loads((root/'docs/REVIEWED_SVG_SHA256.json').read_text())
          for rel,wanted in expected.items():
              actual=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert actual==wanted,(rel,actual,wanted)
          print('All eight SVGs match the locally reviewed versions byte-for-byte')
          PY
      - name: Remove temporary transport
        run: |
          rm -rf paper_a_figures/engraved_workflow/ink_v6/_transfer paper_a_figures/engraved_workflow/ink_v6/__pycache__
          rm .github/workflows/publish-workflow-v6-once.yml
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-ink-v6-reviewed
          path: paper_a_figures/engraved_workflow/ink_v6
          include-hidden-files: true
          if-no-files-found: error
      - name: Commit reviewed outputs on the figure branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- paper_a_figures/engraved_workflow/ink_v6 .github/workflows/publish-workflow-v6-once.yml
          git diff --cached --stat
          git commit -m 'fig(A): publish reviewed V6 four-palette workflow, six operation diagrams and PR69 prose'
          git push origin HEAD:figures/workflow-v6-relations-six-operations-20260927
