name: A paper revision workspace
on:
  push:
    branches: [docs/a-paper-annotations-20260927]
    paths: ['.github/workflows/a-paper-revision-workspace.yml']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/总体/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题一/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题二/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题三/图片
      - name: Package existing figure assets without regenerating data
        shell: python
        run: |
          import pathlib, zipfile
          w = pathlib.Path('20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解')
          with zipfile.ZipFile('paper-existing-figures.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for folder in ['总体', '问题一', '问题二', '问题三']:
                  for p in sorted((w/folder/'图片').rglob('*')):
                      if p.is_file(): z.write(p, str(p))
          print('Existing assets copied only. No experimental execution.')
      - uses: actions/upload-artifact@v4
        with:
          name: paper-existing-figures
          path: paper-existing-figures.zip
          retention-days: 3
