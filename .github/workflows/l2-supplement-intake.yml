name: Temporary L2 source intake
on:
  push:
    branches: ['feat/l2-q3-supplement-20260926']
    paths: ['.github/workflows/l2-supplement-intake.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Restore only eight selected A inputs
        shell: bash
        run: |
          git lfs pull --include='题目/A题/**/data/case_001.json,题目/A题/**/data/case_026.json,题目/A题/**/data/case_030.json,题目/A题/**/data/case_033.json,题目/A题/**/data/case_044.json,题目/A题/**/data/case_080.json,题目/A题/**/data/case_083.json,题目/A题/**/data/case_086.json' --exclude=''
      - name: Export source and selected original data without running solvers
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile
          root=Path('.')
          selected={'case_001.json','case_026.json','case_030.json','case_033.json','case_044.json','case_080.json','case_083.json','case_086.json'}
          paths=set()
          for name in ['L2提升','research_a_orion_trident','research_a_orion_unified','research_a_orion_anytime','research_a_orion_track_anytime','research_a_orion_track_structure','research_a_orion_track_memory']:
              for p in (root/name).rglob('*'):
                  if not p.is_file() or '__pycache__' in p.parts or 'runs' in p.parts: continue
                  if name=='L2提升' or p.suffix in ('.py','.md','.ps1') or (name=='research_a_orion_trident' and p.suffix in ('.json','.csv') and p.stat().st_size<2_000_000): paths.add(p)
          for p in (root/'题目/A题').rglob('*'):
              if p.is_file() and (p.suffix=='.py' or p.name=='config.txt' or p.name in selected): paths.add(p)
          for p in (root/'20hw_myskill_distribution/20hw_myskill_distribution/workshop_v1/求解').glob('*.py'): paths.add(p)
          missing=[]
          for name in selected:
              data=list((root/'题目/A题').glob('**/data/'+name))
              if not data or data[0].read_bytes().startswith(b'version https://git-lfs.github.com'): missing.append(name)
          with zipfile.ZipFile('l2_source_intake.zip','w',zipfile.ZIP_DEFLATED,compresslevel=3) as z:
              for p in sorted(paths): z.write(p,p.as_posix())
              z.writestr('INTAKE.json',json.dumps({'base':'70d4888886cd9f77037f7b010ce0241349ef056d','selected_input_missing':missing,'files':len(paths),'solver_executed':False}))
          print('files',len(paths),'missing',missing)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: l2-source-intake
          path: l2_source_intake.zip
          retention-days: 3
