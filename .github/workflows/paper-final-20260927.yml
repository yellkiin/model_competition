name: Compile final annotated A manuscript
on:
  push:
    branches: [paper/a-annotations-l2-final-20260927]
    paths:
      - .github/workflows/paper-final-20260927.yml
      - .github/paper-final/**
permissions:
  contents: write
concurrency:
  group: paper-final-20260927
  cancel-in-progress: false
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/paper-final
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/论文
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/数据/l2_patch_60_62
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/总体/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题一/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题二/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/求解/问题三/图片
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/提交附件/支撑材料文件/问题一/源码
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/提交附件/支撑材料文件/问题二/源码
            20hw_myskill_distribution/20hw_myskill_distribution/workshop_v2/提交附件/支撑材料文件/问题三/源码
            paper_a_figures/engraved_workflow/ink_v3
            各种建模agent/MathModelAgent/backend/fonts
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: actions/cache/restore@v4
        id: texcache
        with:
          path: C:/Users/runneradmin/AppData/Roaming/TinyTeX
          key: paper-native-tex-20260927-explicit-v2
      - name: Install typesetting dependencies
        shell: pwsh
        run: |
          tlmgr install xetex fandol lm tex-gyre latexmk algorithmicx algorithms amsfonts amsmath appendix auxhook bigfoot bigintcalc bitset booktabs caption catchfile colortbl cprotect ctex enumitem environ etexcmds etoolbox fancyvrb float fontspec fvextra geometry gettitlestring graphics hycolor hyperref iftex infwarerr intcalc kvdefinekeys kvoptions kvsetkeys l3backend latex2pydata lineno listings ltxcmds makecell mdframed minted multirow natbib needspace pdfcol pdfescape pdftexcmds pgf pgfopts placeins refcount rerunfilecheck setspace siunitx stringenc subfig tcolorbox tikzfill titlesec tocloft tools translations trimspaces ulem uniquecounter upquote url xcolor xecjk xurl zhnumber zref ifplatform xstring xkeyval
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --quiet PyMuPDF fonttools latexminted pandas numpy lxml
      - name: Apply reviewed manuscript text and existing result data
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python .github/paper-final/apply.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/paper-final/figures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the current manuscript only
        shell: python
        env:
          PYTHONUTF8: '1'
        run: |
          from pathlib import Path
          import subprocess, os
          base='bb9ef99b041a2715c97fcadbd018dce2fbd7239d'
          out=Path('.github/paper-final')
          for name in ['native_fonts.py','build.py']:
              data=subprocess.check_output(['git','show',base+':.github/paper-review/'+name]).decode('utf-8')
              if name=='build.py':
                  begin=data.index("run(['git','fetch'")
                  end=data.index('# A disposable compile copy')
                  setup="changed=[Path(p) for p in subprocess.check_output(['git','diff','--name-only','-z']).decode('utf-8').split('\\0') if p]\nchanged += [WS/'论文/paper-review.sty',WS/'论文/图片/workflow_mono_v3.pdf']\nchanged=list(dict.fromkeys(changed))\n\n"
                  data=data[:begin]+setup+data[end:]
                  data=data.replace("BRANCH='fix/paper-a-annotations-20260927'","BRANCH='paper/a-annotations-l2-final-20260927'")
                  data=data.replace('revise(A): implement annotated theory, notation, workflow and compiled manuscript','docs(A): finalize annotation revisions and complete L2-aware results with compiled PDF')
              (out/name).write_text(data,encoding='utf-8')
          subprocess.run(['python',str(out/'build.py')],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-a-manuscript-review
          path: paper-review-output/
          retention-days: 7
          if-no-files-found: warn
