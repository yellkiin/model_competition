name: ORION Anytime Wu real paired study
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/orion_anytime_wu_export.yml']
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    if: github.event.pull_request.head.ref == 'orion/track-anytime_wu'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    outputs:
      code_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orion/track-anytime_wu
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research_a_orion_track_anytime
      - uses: actions/download-artifact@v4
        with:
          name: orion-anytime-wu-frozen-inputs
          run-id: 36104651803
          github-token: ${{ github.token }}
          path: /tmp/source
      - name: Materialize documented prior lineage, not experiments
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/source/orion_anytime_wu_frozen.zip') as z:
            for n in z.namelist():
              if n.startswith('prior_pr26/'):z.extract(n,'.')
          PY
          python research_a_orion_track_anytime/materialize_lineage.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_a_orion_track_anytime/*.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(anytime-wu): freeze complete executable independent source'
            git push origin HEAD:orion/track-anytime_wu
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          import zipfile,subprocess,json
          d=Path('research_a_orion_track_anytime')
          with zipfile.ZipFile('/tmp/wu_executable.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in d.glob('*.py'):z.write(f,str(f))
            z.writestr('WU_EXECUTION_COMMIT.json',json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'policy':'wu-v1.1'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wu-frozen-executable
          path: /tmp/wu_executable.zip
  experiment:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        case: ['001','024','044','059','083','084','086']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.code_commit }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research_a_orion_track_anytime
      - uses: actions/download-artifact@v4
        with:
          name: orion-anytime-wu-frozen-inputs
          run-id: 36104651803
          github-token: ${{ github.token }}
          path: /tmp/source
      - name: Restore unchanged official inputs and raw selected-record provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/source/orion_anytime_wu_frozen.zip') as z:
            for n in z.namelist():
              if n.startswith(('research_a_orion_anytime/','raw_day01/','题目/A题/','source_metadata/')):z.extract(n,'.')
          Path('/tmp/wu_results').mkdir()
          PY
          python -c "import psutil"
      - name: Fixed official replay and actual cache diagnostics
        run: python -u -m research_a_orion_track_anytime.prepare --cases ${{ matrix.case }} --workers 1 --out /tmp/wu_results/preparation
      - name: Same-machine warm then cold, same budgets, immutable official evaluator
        run: |
          python -u -m research_a_orion_track_anytime.runner --cases ${{ matrix.case }} --questions 1,2,3 --cores 2,5 --modes warm,cold --methods old,combined --seconds 30 --max-evaluations 16 --total-seconds 1400 --pair-seconds 60 --workers auto --max-workers 2 --seed-manifest /tmp/wu_results/preparation/seed_manifest.json --out /tmp/wu_results/paired30
          cat /tmp/wu_results/paired30/run_summary.json
      - name: Persist the exact execution commit
        if: always()
        run: |
          mkdir -p /tmp/wu_results/source
          cp research_a_orion_track_anytime/*.py /tmp/wu_results/source/
          echo '${{ needs.freeze.outputs.code_commit }}' > /tmp/wu_results/EXECUTION_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wu-real-case-${{ matrix.case }}
          path: /tmp/wu_results
          compression-level: 6
          if-no-files-found: error
