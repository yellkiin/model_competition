name: ORION Anytime Wu duplicate-run guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  guard:
    if: github.event.pull_request.head.ref == 'orion/track-anytime_wu'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the accidentally duplicated study, preserve primary run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          root='https://api.github.com/repos/yellkiin/model_competition/actions/runs/36106800532'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          data=json.load(urllib.request.urlopen(urllib.request.Request(root,headers=headers)))
          if data['status']!='completed':
            urllib.request.urlopen(urllib.request.Request(root+'/cancel',data=b'{}',headers=headers,method='POST')).read()
            print('Cancellation requested for duplicate run 36106800532 only')
          else:print('Duplicate already completed; retain evidence and exclude from primary selection')
          print('Primary 36106285863 is not cancelled or rerun. No solver invocation in this workflow.')
          PY
