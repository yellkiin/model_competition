<g id="material-grammar" inkscape:groupmode="layer" inkscape:label="材质：不用彩色面板区分信息"><title>材质：不用彩色面板区分信息</title>
<path class="fine" d="M70,750H1730" />
<text x="70" y="821" font-size="34" text-anchor="start" class="bold">03  材质与黑白对比</text>
<rect x="80" y="864" width="140" height="87" class="paper" />
<text x="150" y="993" font-size="26" text-anchor="middle" class="">留白</text>
<rect x="274" y="864" width="140" height="87" class="hatch" />
<text x="344" y="993" font-size="26" text-anchor="middle" class="">斜排线</text>
<rect x="468" y="864" width="140" height="87" class="grid" />
<text x="538" y="993" font-size="26" text-anchor="middle" class="">张量格</text>
<rect x="662" y="864" width="140" height="87" class="black" />
<text x="732" y="993" font-size="26" text-anchor="middle" class="">实黑</text>
<text x="80" y="1050" font-size="24" text-anchor="start" class="muted">白底；不使用阴影滤镜、渐变或外部位图。</text>
</g>
<g id="type-grammar" inkscape:groupmode="layer" inkscape:label="文字保留为可编辑text与tspan"><title>文字保留为可编辑text与tspan</title>
<text x="960" y="821" font-size="34" text-anchor="start" class="bold">04  文字层级</text>
<text x="965" y="884" font-size="29" text-anchor="start" class="serif">主标题：Noto Serif CJK SC / 59</text>
<text x="965" y="940" font-size="27" text-anchor="start" class="">模块：39 / 31；说明：24–28</text>
<text x="965" y="997" font-size="35" text-anchor="start" class="math">ℰ<tspan baseline-shift="sub" font-size="70%">q</tspan>(G, x; θ)  →  (C<tspan baseline-shift="sub" font-size="70%">q</tspan>, D<tspan baseline-shift="sub" font-size="70%">q</tspan>)</text>
<text x="965" y="1050" font-size="24" text-anchor="start" class="muted">数学下标使用 tspan；正文不转轮廓。</text>
</g>
<path class="fine" d="M70,1110H1730" />
<text x="70" y="1148" font-size="22" text-anchor="start" class="muted">线宽与字号以上述 3000 × 2120 母版坐标为准；只在关键对象上使用实黑。</text>
</svg>
