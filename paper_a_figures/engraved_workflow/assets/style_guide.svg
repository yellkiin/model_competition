<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="300mm" height="196.667mm" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
<title id="title">黑白线刻图形语法与可编辑组件</title>
<desc id="desc">可编辑黑白线刻流程图。以六算子分叉汇合案例表达划分、归核、顺序、候选生成、预检、完整执行、字典序接受与反馈；第三问固定同一方案作无L2对照。案例为机制示意，不是实测计划。</desc>
<defs>
<style>
text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#171717;stroke:none}
.serif,.math{font-family:'Noto Serif CJK SC','STIX','Noto Serif',serif}
.halo{paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round}
.bold{font-weight:700}.muted{fill:#505050}.white{fill:white}
path,rect,ellipse{stroke-linecap:round;stroke-linejoin:round}
.fine{fill:none;stroke:#171717;stroke-width:1.6}
.hair{fill:none;stroke:#505050;stroke-width:.85}
.faint{fill:none;stroke:#b6b6b6;stroke-width:1.1}
.route{fill:none;stroke:#171717;stroke-width:3}
.outline{fill:none;stroke:#171717;stroke-width:2}
.paper{fill:white;stroke:#171717;stroke-width:2}
.black{fill:#171717;stroke:#171717;stroke-width:1.5}
.hatch{fill:url(#hatch);stroke:#171717;stroke-width:1.3}
.grid{fill:url(#grid);stroke:#171717;stroke-width:1.8}
.dashed{fill:none;stroke:#505050;stroke-width:1.6;stroke-dasharray:7 6}
.boundary{fill:url(#sparse);stroke:#171717;stroke-width:2.3;stroke-dasharray:10 5}
</style>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="white"/><path d="M-1,1L1,-1M0,6L6,0M5,7L7,5" stroke="#171717" stroke-width=".6"/></pattern>
<pattern id="sparse" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="white"/><path d="M0,12L12,0" stroke="#b6b6b6" stroke-width=".5"/></pattern>
<pattern id="grid" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="white"/><path d="M7,0H0V7" fill="none" stroke="#171717" stroke-width=".55"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0L10,5L0,10L2.6,5Z" fill="#171717"/></marker>
</defs>
<g id="style-page" inkscape:groupmode="layer" inkscape:label="黑白线刻图形语法"><title>黑白线刻图形语法</title>
<rect x="0" y="0" width="1800" height="1180" class="" fill="white" stroke="none"/>
<path class="route" d="M70,65H1730" />
<text x="70" y="139" font-size="51" text-anchor="start" class="serif bold">黑白线刻 / 图形语法</text>
<text x="70" y="191" font-size="27" text-anchor="start" class="">共用节点、线条、材质与文字层级；后续图件直接复用 Drawing。</text>
<path class="fine" d="M70,220H1730" />
</g>
