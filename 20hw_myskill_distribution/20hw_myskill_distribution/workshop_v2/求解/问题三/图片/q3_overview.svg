<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="162mm" height="81.0000mm"><defs><style>text {font-family:'Times New Roman','SimSun','Noto Serif CJK SC',serif;fill:#202724;} .label {font-size:23px;} path,line,polyline,rect,ellipse {stroke-linecap:round;stroke-linejoin:round;}</style><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9 L3.5,5 Z" fill="#202724" stroke="none" /></marker><pattern id="hatch-ink" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M-1,9 L9,-1 M8,10 L10,8" fill="none" stroke="#202724" stroke-width=".7" opacity=".55" /></pattern><marker id="arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9 L3.5,5 Z" fill="#446E67" stroke="none" /></marker><pattern id="hatch-s" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M-1,9 L9,-1 M8,10 L10,8" fill="none" stroke="#446E67" stroke-width=".7" opacity=".55" /></pattern><marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9 L3.5,5 Z" fill="#94784D" stroke="none" /></marker><pattern id="hatch-m" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M-1,9 L9,-1 M8,10 L10,8" fill="none" stroke="#94784D" stroke-width=".7" opacity=".55" /></pattern><marker id="arrow-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9 L3.5,5 Z" fill="#9A655B" stroke="none" /></marker><pattern id="hatch-f" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M-1,9 L9,-1 M8,10 L10,8" fill="none" stroke="#9A655B" stroke-width=".7" opacity=".55" /></pattern></defs><rect x="0" y="0" width="1200" height="600" fill="white" stroke="none" /><text x="25" y="40" font-size="22" fill="#446E67" text-anchor="start" id="q3_overview-label-1" style="fill:#446E67">01</text><text x="69" y="40" font-size="26" fill="#202724" text-anchor="start" id="q3_overview-label-2" style="fill:#202724">继承共同候选</text><line x1="25" y1="57" x2="375" y2="57" stroke="#446E67" stroke-width="1.25" /><text x="421" y="40" font-size="22" fill="#9A655B" text-anchor="start" id="q3_overview-label-3" style="fill:#9A655B">02</text><text x="465" y="40" font-size="26" fill="#202724" text-anchor="start" id="q3_overview-label-4" style="fill:#202724">增加FIFO时序调整</text><line x1="421" y1="57" x2="771" y2="57" stroke="#9A655B" stroke-width="1.25" /><text x="824" y="40" font-size="22" fill="#94784D" text-anchor="start" id="q3_overview-label-5" style="fill:#94784D">03</text><text x="868" y="40" font-size="26" fill="#202724" text-anchor="start" id="q3_overview-label-6" style="fill:#202724">统一执行与反馈</text><line x1="824" y1="57" x2="1174" y2="57" stroke="#94784D" stroke-width="1.25" /><rect x="48" y="109" width="318" height="60" fill="#f5f7f7" stroke="#446E67" stroke-width="1.4" rx="3" /><text x="207.0" y="146.59" font-size="23" fill="#446E67" text-anchor="middle" id="q3_overview-label-7" style="fill:#446E67">基础构造与结构变换</text><rect x="48" y="212" width="318" height="60" fill="#f9f8f5" stroke="#94784D" stroke-width="1.4" rx="3" /><text x="207.0" y="249.59" font-size="23" fill="#94784D" text-anchor="middle" id="q3_overview-label-8" style="fill:#94784D">驻留重组与通信映射</text><text x="207" y="318" font-size="22" fill="#535E59" text-anchor="middle" id="q3_overview-label-9" style="fill:#535E59">对应总图操作 a—e</text><text x="207" y="352" font-size="22" fill="#535E59" text-anchor="middle" id="q3_overview-label-10" style="fill:#535E59">共享当前完整方案</text><rect x="462" y="147" width="200" height="65" fill="#f5f0ef" stroke="#9A655B" stroke-width="1.4" rx="0" /><rect x="462" y="147" width="200" height="65" fill="url(#hatch-f)" stroke="none" /><text x="562" y="187" font-size="23" fill="#9A655B" text-anchor="middle" id="q3_overview-label-11" style="fill:#9A655B">有效驻留窗口</text><line x1="437" y1="243" x2="780" y2="243" stroke="#535E59" stroke-width="1" /><line x1="462" y1="231" x2="462" y2="252" stroke="#535E59" stroke-width="1" /><text x="462" y="279" font-size="20" fill="#535E59" text-anchor="middle" id="q3_overview-label-12" style="fill:#535E59">填充</text><line x1="562" y1="231" x2="562" y2="252" stroke="#535E59" stroke-width="1" /><text x="562" y="279" font-size="20" fill="#9A655B" text-anchor="middle" id="q3_overview-label-13" style="fill:#9A655B">调整后</text><line x1="662" y1="231" x2="662" y2="252" stroke="#535E59" stroke-width="1" /><text x="662" y="279" font-size="20" fill="#535E59" text-anchor="middle" id="q3_overview-label-14" style="fill:#535E59">淘汰</text><line x1="750" y1="231" x2="750" y2="252" stroke="#535E59" stroke-width="1" /><text x="750" y="279" font-size="20" fill="#535E59" text-anchor="middle" id="q3_overview-label-15" style="fill:#535E59">原读入</text><path d="M750,222 L750,118 L562,118 L562,136" fill="none" stroke="#9A655B" stroke-width="1.8" marker-end="url(#arrow-f)" /><text x="604" y="323" font-size="20" fill="#535E59" text-anchor="middle" id="q3_overview-label-16" style="fill:#535E59">对应总图操作 f</text><text x="604" y="357" font-size="20" fill="#535E59" text-anchor="middle" id="q3_overview-label-17" style="fill:#535E59">保持划分与映射，调整核内顺序</text><polygon points="862,113 873,102 1146,102 1135,113" fill="white" stroke="#202724" stroke-width="1.1" /><polygon points="862,113 873,102 1146,102 1135,113" fill="url(#hatch-ink)" stroke="none" /><polygon points="1135,113 1146,102 1146,163 1135,174" fill="white" stroke="#202724" stroke-width="1.1" /><polygon points="1135,113 1146,102 1146,163 1135,174" fill="url(#hatch-ink)" stroke="none" /><rect x="862" y="113" width="273" height="61" fill="#f2f2f2" stroke="#202724" stroke-width="1.4" rx="0" /><text x="998.5" y="151.42" font-size="24" fill="#202724" text-anchor="middle" id="q3_overview-label-18" style="fill:#202724">任务与缓存事件</text><text x="998" y="230" font-size="22" fill="#535E59" text-anchor="middle" id="q3_overview-label-19" style="fill:#535E59">读请求发射时查询</text><text x="998" y="267" font-size="22" fill="#535E59" text-anchor="middle" id="q3_overview-label-20" style="fill:#535E59">读完成后尝试填充</text><text x="998" y="304" font-size="22" fill="#535E59" text-anchor="middle" id="q3_overview-label-21" style="fill:#535E59">FIFO队首依次淘汰</text><text x="998" y="356" font-size="21" fill="#535E59" text-anchor="middle" id="q3_overview-label-22" style="fill:#535E59">先比较周期，再比较搬运</text><path d="M207,373 L207,430" fill="none" stroke="#446E67" stroke-width="1.8" marker-end="url(#arrow-s)" /><path d="M604,376 L604,404 L207,404" fill="none" stroke="#9A655B" stroke-width="1.8" /><rect x="80" y="445" width="260" height="50" fill="#f5f7f7" stroke="#446E67" stroke-width="1.4" rx="3" /><text x="210.0" y="477.59" font-size="23" fill="#446E67" text-anchor="middle" id="q3_overview-label-23" style="fill:#446E67">构造完整候选</text><rect x="460" y="445" width="270" height="50" fill="#f9f8f5" stroke="#94784D" stroke-width="1.4" rx="3" /><text x="595.0" y="477.59" font-size="23" fill="#94784D" text-anchor="middle" id="q3_overview-label-24" style="fill:#94784D">完整执行评价</text><rect x="860" y="445" width="270" height="50" fill="#f9f7f6" stroke="#9A655B" stroke-width="1.4" rx="3" /><text x="995.0" y="477.59" font-size="23" fill="#9A655B" text-anchor="middle" id="q3_overview-label-25" style="fill:#9A655B">保留更优方案</text><path d="M353,470 L445,470" fill="none" stroke="#202724" stroke-width="1.8" marker-end="url(#arrow-ink)" /><path d="M744,470 L845,470" fill="none" stroke="#202724" stroke-width="1.8" marker-end="url(#arrow-ink)" /><path d="M995,508 L995,535 L20,535 L20,237 L35,237" fill="none" stroke="#446E67" stroke-width="1.5" marker-end="url(#arrow-s)" /><text x="38" y="583" font-size="22" fill="#535E59" text-anchor="start" id="q3_overview-label-26" style="fill:#535E59">搜索结束：固定同一方案，比较无L2与有L2的执行时间</text></svg>